<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temple Visits by State</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="site-header">
        <h1>Temple Visits by State</h1>
        <p>Select a state to view temples and visit status.</p>
    </header>

    <main class="container">
        <section class="map-section">
            <h2>United States</h2>
            <p class="map-note">
                This is a simple clickable state grid. You can replace it later with an SVG U.S. map if you want.
            </p>

            <div class="states-grid" id="statesGrid"></div>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
